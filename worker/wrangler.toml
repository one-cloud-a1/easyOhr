name = "easyohrcloudflare"
main = "index.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 6 * * 1"]

[vars]
SITE_URL = "https://one-cloud-a1.github.io/easyOhr"
BETRIEB_EMAIL = "hi@hoffnungsohr.de"
ABSENDER_EMAIL = "easyOhr <noreply@easyohr.de>"
BETRIEB_TELEFON = "0156 78669304"

# Secrets (Cloudflare Dashboard → Worker → Settings → Variables, als Secret):
# RESEND_API_KEY      — für den Mailversand, zwingend erforderlich
# GITHUB_TOKEN        — für die wöchentliche Preisanpassung
# ADMIN_SECRET        — schützt /api/prices/update
#
# Anfragen werden nicht in einer Datenbank gespeichert. Die Mail an
# BETRIEB_EMAIL ist der Datensatz — siehe Kommentar in index.ts.
